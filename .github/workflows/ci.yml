name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (typecheck + unit tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (fail on high/critical CVEs)
        # --omit=dev excludes dev-only tools (vsce, tsx, esbuild, typescript)
        # whose CVEs do not affect end users — only the shipped extension code
        # matters for the security guarantee.
        run: npm audit --audit-level=high --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (no Docker required)
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Verify .vsix packages cleanly
        run: npx vsce package --no-dependencies --out /tmp/ci-package.vsix && ls -lh /tmp/ci-package.vsix